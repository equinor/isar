version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Group all uv version updates together.
      python-dependencies:
        patterns: ["*"]
        applies-to: version-updates
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
